name: Phreesia
kind: company
description: Phreesia is a patient intake, registration, scheduling, payments, and
  engagement platform for healthcare organizations, powering more than 150 million
  patient visits annually. It delivers digital check-in, mobile intake and consent
  forms in 20+ languages, logic-driven patient interviews, real-time insurance
  eligibility verification, and patient payments, and pushes the resulting data
  back into the provider's systems of record. Phreesia is not a self-serve public
  API product - it is an enterprise platform whose integrations are delivered by a
  dedicated interoperability team using open healthcare standards (HL7v2, FHIR, CCD,
  CSV) alongside proprietary APIs and data extracts, with bidirectional interfaces
  into EHR/EMR, PM, HIE, data warehouse, and data lake systems (Epic, athenahealth,
  eClinicalWorks, NextGen, Oracle Health/Cerner, Veradigm, Meditech, ModMed, and
  more). There is no publicly documented developer portal, API reference, or
  self-service key registration as of this writing; the API surface below is modeled
  from Phreesia's published product and integration capabilities, not from public
  reference documentation.
